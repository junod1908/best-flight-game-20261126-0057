<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMOKEWING — Wildfire Airtanker</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2a30; font-family: Verdana, Geneva, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f2f6ef; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  .panel { position: absolute; background: rgba(8, 26, 30, .62); border: 1px solid rgba(255, 210, 140, .45); border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
  #hud-left { top: 12px; left: 12px; min-width: 190px; }
  #hud-right { top: 12px; right: 12px; min-width: 210px; text-align: right; }
  #hud-left b, #hud-right b { color: #ffd28c; }
  .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.18); overflow: hidden; margin: 3px 0 6px; }
  .bar > div { height: 100%; border-radius: 5px; }
  #fuel-fill { background: #ffb02e; width: 100%; }
  #water-fill { background: #37b6ff; width: 0%; }
  #banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(8, 26, 30, .62); border: 1px solid rgba(255, 210, 140, .45); border-radius: 8px; padding: 6px 16px; font-size: 15px; font-weight: bold; color: #ffd28c; white-space: nowrap; }
  #msg { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 15px; color: #ffe9c4; background: rgba(8, 26, 30, .55); padding: 6px 14px; border-radius: 8px; white-space: nowrap; }
  #help { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: #dfeee8; opacity: .85; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; background: rgba(6, 20, 24, .55); }
  #overlay .card { background: rgba(10, 34, 38, .92); border: 2px solid #ff9a3c; border-radius: 12px; padding: 28px 36px; max-width: 560px; color: #f2f6ef; text-align: center; }
  #overlay h1 { margin: 0 0 4px; color: #ffb02e; font-size: 34px; letter-spacing: 2px; }
  #overlay h2 { margin: 0 0 12px; color: #7fd4c0; font-size: 15px; font-weight: normal; }
  #overlay p { font-size: 14px; line-height: 1.6; text-align: left; }
  #overlay .keys { font-size: 13px; color: #ffd28c; }
  #overlay button { margin-top: 14px; font-size: 17px; padding: 10px 28px; border-radius: 8px; border: none; background: #ff8c1a; color: #1c1000; font-weight: bold; cursor: pointer; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SMOKEWING wildfire airtanker: scoop lake water and drop it on the spreading fires"></canvas>
<div id="hud">
  <div class="panel" id="hud-left">
    ALT <b id="hud-alt">0</b> m &nbsp; SPD <b id="hud-spd">0</b> kt<br>
    HDG <b id="hud-hdg">000</b>&deg; &nbsp; V/S <b id="hud-vs">0</b><br>
    SCORE <b id="hud-score">0</b> &nbsp; TIME <b id="hud-time">0:00</b>
  </div>
  <div class="panel" id="hud-right">
    FUEL <b id="hud-fuel">100%</b><div class="bar"><div id="fuel-fill"></div></div>
    WATER <b id="hud-water">0%</b><div class="bar"><div id="water-fill"></div></div>
    FIRES OUT <b id="hud-fires">0 / 3</b> &nbsp; WIND <b id="hud-wind">W 12</b>
  </div>
  <div id="banner">SMOKEWING &mdash; WILDFIRE AIRTANKER</div>
  <div id="msg"></div>
  <div id="help">W/S throttle &middot; Arrows pitch &amp; bank &middot; SPACE drop water &middot; P/Esc pause &middot; M sound &middot; R restart</div>
</div>
<div id="overlay"></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
